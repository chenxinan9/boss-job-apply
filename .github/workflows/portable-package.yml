name: Portable package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python tools/package.py
      - run: python -m unittest discover -s tests -v
      - name: Download published Codex package over HTTPS
        if: github.event_name == 'release'
        run: python tools/download_release.py --candidate --client codex --destination "${{ runner.temp }}/boss-download-codex"
      - name: Download published WorkBuddy macOS package over HTTPS
        if: github.event_name == 'release'
        run: python tools/download_release.py --candidate --client workbuddy-macos --destination "${{ runner.temp }}/boss-download-workbuddy-macos"

      - name: Download published WorkBuddy Windows package over HTTPS
        if: github.event_name == 'release'
        run: python tools/download_release.py --candidate --client workbuddy-windows --destination "${{ runner.temp }}/boss-download-workbuddy-windows"
