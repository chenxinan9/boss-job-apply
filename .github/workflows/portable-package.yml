name: Portable package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python tools/package.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - run: python packages/boss-apply-workbuddy/scripts/doctor.py --client workbuddy
      - name: Prepare real native runtime (macOS, no UI or MCP launch)
        if: runner.os == 'macOS'
        run: bash packages/boss-apply-workbuddy-macos/prepare-desktop.sh "$GITHUB_WORKSPACE"
      - name: Prepare real native runtime (Windows, no UI or MCP launch)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File packages/boss-apply-workbuddy-windows/prepare-desktop.ps1 -Workspace "$env:GITHUB_WORKSPACE"
      - name: Download published Codex package over HTTPS
        if: github.event_name == 'release'
        run: python tools/download_release.py --client codex --destination "${{ runner.temp }}/boss-download-codex"
      - name: Download published WorkBuddy macOS package over HTTPS
        if: github.event_name == 'release'
        run: python tools/download_release.py --client workbuddy-macos --destination "${{ runner.temp }}/boss-download-workbuddy-macos"

      - name: Download published WorkBuddy Windows package over HTTPS
        if: github.event_name == 'release'
        run: python tools/download_release.py --client workbuddy-windows --destination "${{ runner.temp }}/boss-download-workbuddy-windows"

  browser-continuity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: ['0.27.0', '0.31.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix browser-test agent-browser@${{ matrix.browser }} --no-audit --no-fund
      - run: node browser-test/node_modules/agent-browser/bin/agent-browser.js install
      - name: Linux display prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libxkbcommon0 libgbm1 libasound2t64
      - name: Real browser continuity (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/browser-smoke.mjs browser-test/node_modules/agent-browser/bin/agent-browser.js
      - name: Real browser continuity (Windows/macOS)
        if: runner.os != 'Linux'
        run: node tools/browser-smoke.mjs browser-test/node_modules/agent-browser/bin/agent-browser.js
